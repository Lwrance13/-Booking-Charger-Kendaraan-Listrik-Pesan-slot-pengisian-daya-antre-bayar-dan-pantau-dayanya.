services:
  station-db:
    image: postgres:16-alpine
    container_name: station-db
    environment:
      POSTGRES_DB: station_db
      POSTGRES_USER: emerald
      POSTGRES_PASSWORD: emerald2026
    volumes:
      - station-db-data:/var/lib/postgresql/data
      - ./services/station-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./services/station-service/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emerald -d station_db"]
      interval: 5s
      retries: 10
    networks:
      - emerald-net

  booking-db:
    image: postgres:16-alpine
    container_name: booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: emerald
      POSTGRES_PASSWORD: emerald2026
    volumes:
      - booking-db-data:/var/lib/postgresql/data
      - ./services/booking-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./services/booking-service/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emerald -d booking_db"]
      interval: 5s
      retries: 10
    networks:
      - emerald-net

  session-db:
    image: timescale/timescaledb:latest-pg16
    container_name: session-db
    environment:
      POSTGRES_DB: session_db
      POSTGRES_USER: emerald
      POSTGRES_PASSWORD: emerald2026
    volumes:
      - session-db-data:/var/lib/postgresql/data
      - ./services/session-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./services/session-service/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emerald -d session_db"]
      interval: 5s
      retries: 10
    networks:
      - emerald-net

  billing-db:
    image: postgres:16-alpine
    container_name: billing-db
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: emerald
      POSTGRES_PASSWORD: emerald2026
    volumes:
      - billing-db-data:/var/lib/postgresql/data
      - ./services/billing-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./services/billing-service/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emerald -d billing_db"]
      interval: 5s
      retries: 10
    networks:
      - emerald-net

  redis:
    image: redis:7-alpine
    container_name: emerald-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - emerald-net

  station-service:
    build:
      context: ./services/station-service
      dockerfile: Dockerfile
    container_name: station-service
    env_file:
      - ./services/station-service/.env.docker
    depends_on:
      station-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emerald-net

  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    env_file:
      - ./services/booking-service/.env.docker
    depends_on:
      booking-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      station-service:
        condition: service_started
    networks:
      - emerald-net

  session-service:
    build:
      context: ./services/session-service
      dockerfile: Dockerfile
    container_name: session-service
    env_file:
      - ./services/session-service/.env.docker
    depends_on:
      session-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      booking-service:
        condition: service_started
      station-service:
        condition: service_started
    networks:
      - emerald-net

  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: billing-service
    env_file:
      - ./services/billing-service/.env.docker
    depends_on:
      billing-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      booking-service:
        condition: service_started
    networks:
      - emerald-net

  gateway:
    image: nginx:1.27-alpine
    container_name: emerald-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - station-service
      - booking-service
      - session-service
      - billing-service
    networks:
      - emerald-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      retries: 5

volumes:
  station-db-data:
  booking-db-data:
  session-db-data:
  billing-db-data:

networks:
  emerald-net:
    driver: bridge

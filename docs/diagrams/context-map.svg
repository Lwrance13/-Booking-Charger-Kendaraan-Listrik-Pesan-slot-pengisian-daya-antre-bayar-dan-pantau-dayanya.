  <text x="450" y="541"
        font-family="Arial,sans-serif" font-size="8.5" font-weight="700"
        fill="#B0F049" text-anchor="middle">POST /invoices {kWh}</text>

  <!-- 5. billing → booking  (vertical, going UP) -->
  <line x1="808" y1="440" x2="808" y2="347"
        stroke="#111" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="750" y="386" width="120" height="19" fill="#111"/>
  <text x="810" y="400"

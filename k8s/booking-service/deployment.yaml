apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: emerald-charge
  labels:
    app: booking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: emerald-charge/booking-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: DATABASE_URL
              value: "******booking-db:5432/booking_db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: emerald-secrets
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: emerald-config
                  key: REDIS_URL
            - name: SS_URL
              valueFrom:
                configMapKeyRef:
                  name: emerald-config
                  key: SS_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

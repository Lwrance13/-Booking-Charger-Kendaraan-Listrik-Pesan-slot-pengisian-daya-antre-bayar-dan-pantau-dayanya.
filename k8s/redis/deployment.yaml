apiVersion: apps/v1
kind: Deployment
metadata:
  name: emerald-redis
  namespace: emerald-charge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emerald-redis
  template:
    metadata:
      labels:
        app: emerald-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
